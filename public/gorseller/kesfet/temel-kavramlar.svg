<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Terazi — varlıklar ve kaynaklar dengesi">
  <!-- MuhasebeLab flat illüstrasyon dili · Temel Kavramlar: denge -->
  <g>
    <rect width="1200" height="460" fill="#faf9f5"/>
    <circle cx="150" cy="90" r="120" fill="#d8e3f0" opacity="0.4"/>
    <circle cx="1070" cy="390" r="150" fill="#d8e3f0" opacity="0.35"/>
    <rect x="80" y="392" width="1040" height="3" rx="1.5" fill="#1d3a5f"/>

    <!-- terazi ayağı -->
    <rect x="560" y="120" width="8" height="240" rx="4" fill="#1d3a5f" transform="translate(36 0)"/>
    <rect x="480" y="360" width="240" height="16" rx="8" fill="#1d3a5f"/>
    <rect x="520" y="344" width="160" height="16" rx="8" fill="#2c4f7c"/>
    <circle cx="600" cy="118" r="14" fill="#2c4f7c"/>
    <!-- kiriş -->
    <rect x="330" y="110" width="540" height="10" rx="5" fill="#1d3a5f"/>

    <!-- sol kefe: paralar (varlıklar) -->
    <g>
      <path d="M352 120l-52 96M352 120l52 96" stroke="#2c4f7c" stroke-width="4"/>
      <path d="M282 216h140l-14 40a56 56 0 0 1-112 0z" fill="#d8e3f0" stroke="#1d3a5f" stroke-width="3.5"/>
      <!-- kefede para destesi -->
      <rect x="322" y="196" width="60" height="13" rx="6.5" fill="#a47339"/>
      <ellipse cx="352" cy="196" rx="30" ry="8" fill="#e8dfcc" stroke="#a47339" stroke-width="2"/>
      <rect x="322" y="181" width="60" height="13" rx="6.5" fill="#a47339"/>
      <ellipse cx="352" cy="181" rx="30" ry="8" fill="#e8dfcc" stroke="#a47339" stroke-width="2"/>
      <ellipse cx="352" cy="181" rx="15" ry="4" fill="none" stroke="#a47339" stroke-width="2"/>
      <text x="352" y="298" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" letter-spacing="3" fill="#1d3a5f" font-weight="700">VARLIKLAR</text>
    </g>

    <!-- sağ kefe: belge (kaynaklar) -->
    <g>
      <path d="M848 120l-52 96M848 120l52 96" stroke="#2c4f7c" stroke-width="4"/>
      <path d="M778 216h140l-14 40a56 56 0 0 1-112 0z" fill="#d8e3f0" stroke="#1d3a5f" stroke-width="3.5"/>
      <!-- kefede belge -->
      <rect x="816" y="150" width="64" height="60" rx="6" fill="#ffffff" stroke="#1d3a5f" stroke-width="3"/>
      <rect x="816" y="150" width="64" height="16" rx="6" fill="#2c4f7c"/>
      <rect x="816" y="158" width="64" height="8" fill="#2c4f7c"/>
      <rect x="826" y="176" width="34" height="6" rx="3" fill="#d8e3f0"/>
      <rect x="826" y="190" width="44" height="6" rx="3" fill="#d8e3f0"/>
      <text x="848" y="298" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" letter-spacing="3" fill="#1d3a5f" font-weight="700">KAYNAKLAR</text>
    </g>

    <!-- eşittir rozeti -->
    <circle cx="600" cy="230" r="34" fill="#ffffff" stroke="#1d3a5f" stroke-width="3.5"/>
    <rect x="586" y="220" width="28" height="6" rx="3" fill="#a47339"/>
    <rect x="586" y="234" width="28" height="6" rx="3" fill="#a47339"/>
  </g>
</svg>
