<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Olaydan rapora — muhasebenin büyük resmi">
  <!-- MuhasebeLab flat illüstrasyon dili · Final: olay → belge → defter → rapor zinciri -->
  <g>
    <rect width="1200" height="460" fill="#faf9f5"/>
    <circle cx="180" cy="80" r="110" fill="#d8e3f0" opacity="0.4"/>
    <circle cx="1040" cy="400" r="140" fill="#d8e3f0" opacity="0.35"/>
    <rect x="80" y="360" width="1040" height="3" rx="1.5" fill="#1d3a5f"/>

    <!-- 1. olay: para -->
    <g>
      <circle cx="200" cy="240" r="62" fill="#ffffff" stroke="#1d3a5f" stroke-width="3.5"/>
      <rect x="172" y="248" width="56" height="13" rx="6.5" fill="#a47339"/>
      <ellipse cx="200" cy="248" rx="28" ry="8" fill="#e8dfcc" stroke="#a47339" stroke-width="2"/>
      <rect x="172" y="232" width="56" height="13" rx="6.5" fill="#a47339"/>
      <ellipse cx="200" cy="232" rx="28" ry="8" fill="#e8dfcc" stroke="#a47339" stroke-width="2"/>
      <ellipse cx="200" cy="232" rx="14" ry="4" fill="none" stroke="#a47339" stroke-width="2"/>
      <text x="200" y="342" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" letter-spacing="3" fill="#1d3a5f" font-weight="700">OLAY</text>
    </g>

    <g stroke="#a47339" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 12">
      <path d="M276 226c34-14 66-16 104-8" fill="none"/>
    </g>
    <path d="M384 210l15 10-17 6z" fill="#a47339"/>

    <!-- 2. belge -->
    <g>
      <circle cx="470" cy="240" r="62" fill="#ffffff" stroke="#1d3a5f" stroke-width="3.5"/>
      <rect x="444" y="206" width="52" height="68" rx="6" fill="#ffffff" stroke="#1d3a5f" stroke-width="3"/>
      <rect x="444" y="206" width="52" height="14" rx="6" fill="#2c4f7c"/>
      <rect x="444" y="213" width="52" height="7" fill="#2c4f7c"/>
      <g fill="#d8e3f0">
        <rect x="452" y="230" width="28" height="6" rx="3"/>
        <rect x="452" y="244" width="36" height="6" rx="3"/>
        <rect x="452" y="258" width="22" height="6" rx="3"/>
      </g>
      <text x="470" y="342" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" letter-spacing="3" fill="#1d3a5f" font-weight="700">BELGE</text>
    </g>

    <g stroke="#a47339" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 12">
      <path d="M546 226c34-14 66-16 104-8" fill="none"/>
    </g>
    <path d="M654 210l15 10-17 6z" fill="#a47339"/>

    <!-- 3. defter (T) -->
    <g>
      <circle cx="740" cy="240" r="62" fill="#ffffff" stroke="#1d3a5f" stroke-width="3.5"/>
      <rect x="712" y="208" width="56" height="64" rx="6" fill="#ffffff" stroke="#1d3a5f" stroke-width="3"/>
      <path d="M720 224h40M740 224v42" stroke="#1d3a5f" stroke-width="3"/>
      <g fill="#d8e3f0">
        <rect x="724" y="234" width="10" height="5" rx="2.5"/>
        <rect x="724" y="246" width="12" height="5" rx="2.5"/>
        <rect x="746" y="234" width="14" height="5" rx="2.5"/>
      </g>
      <text x="740" y="342" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" letter-spacing="3" fill="#1d3a5f" font-weight="700">DEFTER</text>
    </g>

    <g stroke="#a47339" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 12">
      <path d="M816 226c34-14 66-16 104-8" fill="none"/>
    </g>
    <path d="M924 210l15 10-17 6z" fill="#a47339"/>

    <!-- 4. rapor -->
    <g>
      <circle cx="1010" cy="240" r="62" fill="#ffffff" stroke="#1d3a5f" stroke-width="3.5"/>
      <rect x="986" y="252" width="12" height="20" rx="4" fill="#d8e3f0"/>
      <rect x="1004" y="238" width="12" height="34" rx="4" fill="#2c4f7c"/>
      <rect x="1022" y="222" width="12" height="50" rx="4" fill="#a47339"/>
      <path d="M988 232l22-16 20-12" stroke="#1d3a5f" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="1032" cy="203" r="4.5" fill="#1d3a5f"/>
      <text x="1010" y="342" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" letter-spacing="3" fill="#1d3a5f" font-weight="700">RAPOR</text>
    </g>
  </g>
</svg>
